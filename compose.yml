version: "3.9"

services:
  devopsdb:
    image: chakalimurali/image2:v2
    ports:
      - "3306:3306"
    deploy:
      replicas: 1
    networks:
      - mynetwork

  application:
    image: chakalimurali/image1:v1
    ports:
      - "1112:8080"
    deploy:
      replicas: 3
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
